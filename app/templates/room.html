<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yebsoft - Toplantı Odası</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/room.css') }}">
</head>
<body>
    <div class="room-container">
        <!-- Üst Bar -->
        <div class="room-header">
            <div class="d-flex align-items-center gap-3">
                <button onclick="window.location.href='/dashboard'" class="btn btn-outline-light btn-sm">
                    ← Geri
                </button>
                <h5 class="mb-0" id="roomTitle">Toplantı Odası</h5>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span class="badge bg-success" id="roomStatus">🔴 Canlı</span>
                <span class="text-muted small" id="roomCode">Kod: ----</span>
                <button onclick="leaveRoom()" class="btn btn-danger btn-sm">Çıkış</button>
            </div>
        </div>

        <!-- Video Alanı -->
        <div class="room-video-area">
            <div class="video-grid" id="videoGrid">
                <!-- Katılımcı videoları buraya gelecek -->
                <div class="video-placeholder">
                    <div class="text-center">
                        <div class="display-1 mb-3">🎥</div>
                        <h5>Toplantıya Katıldınız</h5>
                        <p class="text-muted">Diğer katılımcılar burada görünecek</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Alt Kontroller -->
        <div class="room-controls">
            <button onclick="toggleAudio()" class="control-btn" id="audioBtn">
                🎤 Ses
            </button>
            <button onclick="toggleVideo()" class="control-btn" id="videoBtn">
                📹 Kamera
            </button>
            <button onclick="toggleScreen()" class="control-btn" id="screenBtn">
                🖥️ Paylaş
            </button>
            <button onclick="showParticipants()" class="control-btn">
                👥 Katılımcılar
            </button>
            <button onclick="showChat()" class="control-btn">
                💬 Sohbet
            </button>
            <button onclick="leaveRoom()" class="control-btn btn-danger">
                📞 Çık
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', path='js/room.js') }}"></script>
</body>
</html>
