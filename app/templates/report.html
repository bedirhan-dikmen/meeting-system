<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yebsoft - Resmi Toplantı Raporu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/report.css') }}">
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Arial, sans-serif; }
        .report-paper { background: #ffffff; border-radius: 10px; border: 1px solid #e5e7eb; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .official-header { border-bottom: 2px solid #0d6efd; }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            .report-paper { border: none !important; box-shadow: none !important; padding: 0 !important; }
        }
    </style>
</head>
<body class="py-4">
    <div class="container" style="max-width: 960px;">
        
        <div class="d-flex justify-content-between align-items-center mb-4 no-print">
            <button onclick="window.location.href='/dashboard'" class="btn btn-outline-secondary btn-sm fw-semibold">
                ← Kontrol Paneline Dön
            </button>
            <div>
                <button onclick="window.print()" class="btn btn-primary btn-sm fw-bold shadow-sm">
                    🖨️ Yazdır / PDF İndir
                </button>
            </div>
        </div>

        <div id="reportContent" class="report-paper p-5">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <div class="mt-3 text-muted fw-semibold">Resmi Toplantı Raporu Derleniyor...</div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', path='js/report.js') }}"></script>
</body>
</html>
