{% extends "base.html" %}

{% block title %}Toplantılarım - YebMeeting{% endblock %}

{% block content %}
<div class="dashboard-page-wrapper" style="padding: 0.5rem 0 1.5rem 0;">

  <!-- PAGE HEADER ROW (UNIFIED POSITIONING) -->
  <div class="dashboard-top-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.15rem; flex-wrap: wrap; gap: 0.75rem;">
    <div>
      <h1 style="font-size: 1.45rem; font-weight: 800; color: #0f172a; margin: 0 0 0.15rem 0; line-height: 1.2; display: flex; align-items: center; gap: 0.55rem;">
        Toplantılarım
      </h1>
      <p style="color: #64748b; font-size: 0.82rem; font-weight: 500; margin: 0; line-height: 1.35;">
        Tüm toplantılarınızı yönetin ve planlayın.
      </p>
    </div>

    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <button onclick="Meetings.openQuickMeetingModal()" class="btn-action-soft" style="background: #ffffff; color: #4f46e5; border: 1px solid #e2e8f0; border-radius: 10px; padding: 0.5rem 1.05rem; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.45rem; height: 38px; transition: all 0.2s ease; box-shadow: 0 2px 6px rgba(0,0,0,0.02);">
        <i class="fas fa-bolt" style="color: #6366f1;"></i> Hızlı Toplantı
      </button>

      <button onclick="Meetings.openCreateModal()" class="btn-action-purple" style="background: #5b5fc7; color: #ffffff; border: none; border-radius: 10px; padding: 0.5rem 1.15rem; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.55rem; height: 38px; box-shadow: 0 4px 12px rgba(91, 95, 199, 0.22); transition: all 0.2s ease;">
        <i class="far fa-calendar-plus"></i> Toplantı Planla <i class="fas fa-chevron-down" style="font-size: 0.7rem;"></i>
      </button>
    </div>
  </div>

  <!-- SUB-HEADER CONTROL BAR: FILTER TABS & 3 VIEW SWITCHERS -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.85rem; flex-wrap: wrap; gap: 1rem;">
    
    <!-- Filter Tabs (Left) -->
    <!-- BUG FIX: Mobilde 4 sekme + rozetler yan yana sıkışıp taşabiliyordu —
         .tab-filter-scroll class'ı ≤768px'de bu satırı yatay kaydırmalı tek
         satıra çeviriyor (bkz. style.css mobil bölümü). -->
    <div class="tab-filter-scroll" style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
      <button onclick="Meetings.switchTab('live')" id="tabBtnLive" class="tab-filter-btn active" style="background: none; border: none; font-size: 0.95rem; font-weight: 700; color: #5b5fc7; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; padding-bottom: 0.4rem; border-bottom: 2px solid #5b5fc7;">
        Canlı Toplantılar <span id="countTabLive" style="background: #dcfce7; color: #166534; font-size: 0.75rem; font-weight: 800; padding: 0.15rem 0.5rem; border-radius: 10px;">2</span>
      </button>

      <button onclick="Meetings.switchTab('scheduled')" id="tabBtnScheduled" class="tab-filter-btn" style="background: none; border: none; font-size: 0.95rem; font-weight: 600; color: #64748b; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; padding-bottom: 0.4rem;">
        Planlı Toplantılar <span id="countTabScheduled" style="background: #f1f5f9; color: #475569; font-size: 0.75rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 10px;">5</span>
      </button>

      <!-- BUG FIX: "Tamamlanan Toplantılar" artık GÜNLÜK (sadece bugün
           tamamlananlar) — tüm geçmiş zaten ayrı "Kayıtlar" arşivinde
           tutuluyor (bkz. meetings.js applyTabFilter/getEffectiveStatus). -->
      <button onclick="Meetings.switchTab('completed')" id="tabBtnCompleted" class="tab-filter-btn" style="background: none; border: none; font-size: 0.95rem; font-weight: 600; color: #64748b; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; padding-bottom: 0.4rem;">
        Tamamlanan Toplantılar <span id="countTabCompleted" style="background: #f1f5f9; color: #475569; font-size: 0.75rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 10px;">0</span>
      </button>

      <!-- YENİ: "İptal Edilenler" — günlük. Hem kullanıcının kartındaki
           "İptal Et"le hem de başlama saati 1 saat geçmiş, hiç başlamamış
           planlı toplantıların otomatik "kaçırıldı" sayılmasıyla dolar
           (bkz. meetings.js getEffectiveStatus). -->
      <button onclick="Meetings.switchTab('cancelled')" id="tabBtnCancelled" class="tab-filter-btn" style="background: none; border: none; font-size: 0.95rem; font-weight: 600; color: #64748b; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; padding-bottom: 0.4rem;">
        İptal Edilenler <span id="countTabCancelled" style="background: #f1f5f9; color: #475569; font-size: 0.75rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 10px;">0</span>
      </button>
    </div>

    <!-- V1 NOT: Liste ve Takvim görünümleri henüz fix'lenmedi; kullanıcı
         isteğiyle görünüm anahtarı UI'dan tamamen kaldırıldı, artık tek
         (Kart) görünüm var — seçim gösteren bir switcher'a gerek kalmadı.
         viewContainerList/viewContainerCalendar konteynerleri ve
         meetings.js'teki renderListView()/renderCalendarView()/switchView()
         fonksiyonları v2'de kolayca geri açılabilsin diye dokunulmadan
         bırakıldı. -->

  </div>

  <!-- VIEW CONTAINER 1: KART GÖRÜNÜMÜ -->
  <div id="viewContainerCard" class="view-panel" style="display: block;">
    <!-- Rendered dynamically by JS (Populated Cards Grid or Card Empty State) -->
  </div>

  <!-- VIEW CONTAINER 2: LİSTE GÖRÜNÜMÜ -->
  <div id="viewContainerList" class="view-panel" style="display: none;">
    <!-- Rendered dynamically by JS (Table View or List Empty State) -->
  </div>

  <!-- VIEW CONTAINER 3: TAKVİM GÖRÜNÜMÜ -->
  <div id="viewContainerCalendar" class="view-panel" style="display: none;">
    <!-- Rendered dynamically by JS (Weekly Calendar Grid or Calendar Empty State) -->
  </div>

</div>


<!-- BUG FIX: Bu sayfa daha önce base.html'deki global "meetingDetailsModal"
     ile AYNI id'ye sahip, daha sade bir modalı burada tekrar tanımlıyordu.
     DOM sırası gereği bu yerel (eksik: oda kodu/aktif katılımcı/gündem/
     güvenlik/katılımcı listesi yok) kopya öne geçip base.html'deki kapsamlı
     modalı gölgeliyordu. Artık tek modal var (base.html), dashboard ve
     /meetings kartlarında aynı, eksiksiz detay modalı kullanılıyor. -->
{% endblock %}

{% block scripts %}
<!-- meetings.js zaten base.html'in "Core Scripts" bölümünde global olarak
     yükleniyor; burada ikinci kez yüklemek gereksiz bir istek + tarayıcı
     konsolunda sessiz bir "const Meetings zaten tanımlı" hatasına yol
     açıyordu. -->
{% endblock %}
