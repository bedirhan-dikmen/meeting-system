<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yebsoft - Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/dashboard.css') }}">
</head>
<body>
    <!-- Sidebar -->
    <nav class="teams-sidebar">
        <a href="/dashboard" class="sidebar-logo">💼</a>
        <button class="sidebar-icon-btn active" title="Toplantılar">
            📅
            <span class="badge" id="meetingCount">0</span>
        </button>
        <button class="sidebar-icon-btn" onclick="location.href='/profile'" title="Profil">
            👤
        </button>
        <div class="sidebar-divider"></div>
        <button class="sidebar-icon-btn mt-auto" onclick="logout()" title="Çıkış">
            🚪
        </button>
    </nav>

    <!-- Ana İçerik -->
    <div class="teams-main-content">
        <!-- Header -->
        <div class="header-area">
            <h4>📅 Kurumsal Toplantı Odaları</h4>
            <div class="header-right">
                <span class="user-info" id="userInfo">👤 Kullanıcı</span>
                <button onclick="loadMeetings()" class="btn btn-outline-purple btn-sm">
                    🔄 Yenile
                </button>
            </div>
        </div>

        <!-- Content -->
        <div class="row g-4">
            <!-- Sol Kart: Toplantı Oluştur -->
            <div class="col-md-4">
                <div class="teams-card p-4">
                    <div class="card-title">🚀 Hızlı Toplantı Başlat</div>
                    
                    <div class="mb-3">
                        <label class="form-label">Toplantı Konusu</label>
                        <input type="text" 
                               id="meetingTitle" 
                               class="form-control" 
                               placeholder="Örn: Haftalık Değerlendirme"
                               maxlength="100">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">⏱️ Toplantı Süresi</label>
                        <select id="meetingDuration" class="form-select">
                            <option value="15">15 Dakika</option>
                            <option value="30">30 Dakika</option>
                            <option value="45">45 Dakika</option>
                            <option value="60" selected>1 Saat</option>
                            <option value="90">1.5 Saat</option>
                            <option value="120">2 Saat</option>
                            <option value="180">3 Saat</option>
                            <option value="240">4 Saat</option>
                        </select>
                    </div>
                    
                    <button onclick="createNewMeeting()" 
                            class="btn btn-purple w-100" 
                            id="createBtn">
                        <span id="createBtnText">🎯 Oda Oluştur</span>
                        <span id="createBtnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                    </button>
                    
                    <div id="createStatus" class="mt-2 small"></div>
                    
                    <div class="mt-3 text-muted small">
                        <kbd>Ctrl + N</kbd> Yeni Toplantı
                    </div>
                </div>
            </div>

            <!-- Sağ Kart: Toplantı Listesi -->
            <div class="col-md-8">
                <div class="teams-card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="card-title mb-0">📋 Aktif Toplantılar</div>
                        <span class="text-muted small" id="meetingTotal"></span>
                    </div>
                    
                    <div id="loadingIndicator" class="text-center py-4 d-none">
                        <div class="spinner-border text-purple" role="status"></div>
                        <div class="text-muted mt-2">Toplantılar yükleniyor...</div>
                    </div>
                    
                    <div class="table-container">
                        <table class="teams-table">
                            <thead>
                                <tr>
                                    <th>Konu</th>
                                    <th>Oda Kodu</th>
                                    <th>Başlangıç</th>
                                    <th>Durum</th>
                                    <th>İşlem</th>
                                </tr>
                            </thead>
                            <tbody id="meetingList">
                                <!-- JS ile doldurulacak -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast custom-toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">
                    Bildirim
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', path='js/dashboard.js') }}?v=2"></script>
</body>
</html>
