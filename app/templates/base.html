<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Kurumsal Toplantı Yönetim Sistemi{% endblock %}</title>
  
  <!-- FontAwesome 6 Icons (Dual CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" crossorigin="anonymous">
  <!-- Main CSS -->
  <link rel="stylesheet" href="/static/css/style.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  {% block head %}{% endblock %}
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand-logo">
        <i class="fas fa-video"></i>
        <span>YebMeeting</span>
      </div>

      <ul class="nav-menu">
        <li id="navItemDashboard" style="display: none;">
          <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
            <i class="fas fa-chart-pie"></i>
            <span>Dashboard / Panel</span>
          </a>
        </li>
        <li id="navItemMeetings">
          <a href="/meetings" class="nav-link {% if request.url.path == '/meetings' %}active{% endif %}">
            <i class="fas fa-calendar-alt"></i>
            <span>Toplantılar</span>
          </a>
        </li>
        <li id="navItemProfile">
          <a href="/profile" class="nav-link {% if request.url.path == '/profile' %}active{% endif %}">
            <i class="fas fa-user-circle"></i>
            <span>Profilim</span>
          </a>
        </li>
      </ul>

      <div style="margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
        <button onclick="Auth.logout()" class="btn btn-secondary" style="width: 100%; justify-content: flex-start; gap: 0.75rem;">
          <i class="fas fa-sign-out-alt" style="color: var(--accent-rose);"></i>
          <span>Çıkış Yap</span>
        </button>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Top Header -->
      <header class="top-header">
        <div class="header-search">
          <i class="fas fa-search" style="color: var(--text-muted);"></i>
          <input type="text" placeholder="Hızlı toplantı ara...">
        </div>

        <div class="header-actions">
          <!-- Dark/Light Theme Toggle -->
          <button onclick="Auth.toggleTheme()" class="icon-btn" title="Tema Değiştir">
            <i class="fas fa-moon"></i>
          </button>

          <!-- Notification Bell -->
          <div style="position: relative;">
            <button class="icon-btn" title="Bildirimler">
              <i class="fas fa-bell"></i>
              <span id="notifBadgeCount" class="badge-count" style="display: none;">0</span>
            </button>
          </div>

          <!-- User Profile Badge -->
          <a href="/profile" class="user-profile-badge" style="cursor: pointer; text-decoration: none; color: inherit;" title="Profilime Git">
            <img id="userAvatarImg" src="" alt="Avatar" style="width: 34px; height: 34px; border-radius: 50%; object-fit: cover; display: none;">
            <div id="userInitials" class="avatar">U</div>
            <div style="display: flex; flex-direction: column; gap: 0.1rem; align-items: flex-start;">
              <span id="userName" style="font-size: 0.85rem; font-weight: 600;">Kullanıcı</span>
              <span id="userRoleBadge" class="role-badge role-badge-user" style="font-size: 0.65rem;">Katılımcı</span>
            </div>
          </a>
        </div>
      </header>

      <!-- Content Body -->
      <main class="content-body">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <!-- Profile Edit Modal -->
  <div id="profileModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 9999; align-items: center; justify-content: center;">
    <div class="modal-content" style="background: var(--bg-card, #1e293b); padding: 1.5rem; border-radius: 12px; max-width: 500px; width: 90%; color: var(--text-primary, #fff); position: relative;">
      <button onclick="Auth.closeProfileModal()" style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer;">&times;</button>
      
      <h3 style="margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
        <i class="fas fa-user-circle" style="color: var(--accent-blue, #3b82f6);"></i>
        Profil Bilgilerini Güncelle
      </h3>

      <!-- Avatar Upload Form -->
      <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <div style="position: relative; margin-bottom: 0.5rem;">
          <img id="modalAvatarPreview" src="" alt="Avatar" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background: #334155; border: 2px solid #3b82f6; display: none;">
          <div id="modalInitialsPreview" class="avatar" style="width: 80px; height: 80px; font-size: 2rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #3b82f6; color: #fff;">U</div>
        </div>
        <label for="avatarInput" class="btn btn-secondary" style="font-size: 0.8rem; cursor: pointer;">
          <i class="fas fa-camera"></i> Fotoğraf Değiştir
        </label>
        <input type="file" id="avatarInput" accept="image/*" style="display: none;" onchange="Auth.handleAvatarUpload(event)">
      </div>

      <!-- User Info Form -->
      <form id="profileForm" onsubmit="Auth.saveProfile(event)" style="display: flex; flex-direction: column; gap: 0.85rem;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
          <div>
            <label style="font-size: 0.8rem; color: var(--text-muted);">Ad</label>
            <input type="text" id="profFirstName" class="form-input" style="width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff;" required>
          </div>
          <div>
            <label style="font-size: 0.8rem; color: var(--text-muted);">Soyad</label>
            <input type="text" id="profLastName" class="form-input" style="width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff;" required>
          </div>
        </div>

        <div>
          <label style="font-size: 0.8rem; color: var(--text-muted);">E-posta Adresi</label>
          <input type="email" id="profEmail" class="form-input" style="width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff;" required>
        </div>

        <div>
          <label style="font-size: 0.8rem; color: var(--text-muted);">Kullanıcı Kodu (Sicil / ID)</label>
          <input type="text" id="profUserCode" class="form-input" style="width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff;" required>
        </div>

        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 0.5rem 0;">

        <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-primary);">Şifre Değiştir (Opsiyonel)</div>
        
        <div>
          <label style="font-size: 0.8rem; color: var(--text-muted);">Mevcut Şifre</label>
          <input type="password" id="profCurrentPass" class="form-input" style="width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff;" placeholder="••••••••">
        </div>

        <div>
          <label style="font-size: 0.8rem; color: var(--text-muted);">Yeni Şifre</label>
          <input type="password" id="profNewPass" class="form-input" style="width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff;" placeholder="En az 6 karakter">
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1rem;">
          <button type="button" onclick="Auth.closeProfileModal()" class="btn btn-secondary">İptal</button>
          <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Kaydet</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notifications Container -->
  <div id="toastContainer" class="toast-container"></div>


  <!-- Core Scripts -->
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/notifications.js"></script>

  {% block scripts %}{% endblock %}
</body>
</html>
