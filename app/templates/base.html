<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Kurumsal Toplantı Yönetim Sistemi{% endblock %}</title>
  
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Main CSS -->
  <link rel="stylesheet" href="/static/css/style.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  {% block head %}{% endblock %}
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand-logo">
        <i class="fas fa-video"></i>
        <span>YebMeeting</span>
      </div>

      <ul class="nav-menu">
        <li>
          <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
            <i class="fas fa-chart-pie"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a href="/meetings" class="nav-link {% if request.url.path == '/meetings' %}active{% endif %}">
            <i class="fas fa-calendar-alt"></i>
            <span>Toplantılarım</span>
          </a>
        </li>
      </ul>

      <div style="margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
        <button onclick="Auth.logout()" class="btn btn-secondary" style="width: 100%; justify-content: flex-start; gap: 0.75rem;">
          <i class="fas fa-sign-out-alt" style="color: var(--accent-rose);"></i>
          <span>Çıkış Yap</span>
        </button>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Top Header -->
      <header class="top-header">
        <div class="header-search">
          <i class="fas fa-search" style="color: var(--text-muted);"></i>
          <input type="text" placeholder="Hızlı toplantı ara...">
        </div>

        <div class="header-actions">
          <!-- Dark/Light Theme Toggle -->
          <button onclick="Auth.toggleTheme()" class="icon-btn" title="Tema Değiştir">
            <i class="fas fa-moon"></i>
          </button>

          <!-- Notification Bell -->
          <div style="position: relative;">
            <button class="icon-btn" title="Bildirimler">
              <i class="fas fa-bell"></i>
              <span id="notifBadgeCount" class="badge-count" style="display: none;">0</span>
            </button>
          </div>

          <!-- User Profile Badge -->
          <div class="user-profile-badge">
            <div id="userInitials" class="avatar">U</div>
            <span id="userName" style="font-size: 0.85rem; font-weight: 600;">Kullanıcı</span>
          </div>
        </div>
      </header>

      <!-- Content Body -->
      <main class="content-body">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <!-- Toast Notifications Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Core Scripts -->
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/notifications.js"></script>

  {% block scripts %}{% endblock %}
</body>
</html>
