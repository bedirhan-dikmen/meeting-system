<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yebsoft - Toplantı Önizleme Lobisi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .preview-card { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .video-preview-box { background: #000; border-radius: 8px; overflow: hidden; position: relative; width: 100%; aspect-ratio: 16/9; }
        .video-preview-box video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .cam-off-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1e1e1e; display: flex; justify-content: center; align-items: center; color: white; font-weight: 600; display: none; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="container" style="max-width: 800px;">
        <div class="preview-card p-4 p-md-5">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-dark" id="meetingTitle">Toplantı Lobisi</h3>
                <p class="text-muted small">Odaya katılmadan önce kamera ve ses ayarlarınızı kontrol edin.</p>
            </div>

            <div class="row g-4 align-items-center">
                <div class="col-md-7">
                    <div class="video-preview-box">
                        <video id="previewVideo" autoplay playsinline muted></video>
                        <div id="camOffOverlay" class="cam-off-overlay">Kameranız Kapalı</div>
                    </div>
                </div>

                <div class="col-md-5">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">📹 Kamera Seçimi</label>
                        <select id="cameraSelect" class="form-select form-select-sm" onchange="changeCamera(this.value)"></select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold small">🎤 Mikrofon Seçimi</label>
                        <select id="micSelect" class="form-select form-select-sm" onchange="changeMic(this.value)"></select>
                    </div>

                    <div class="d-flex flex-column gap-2 mb-4">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="joinWithAudio" checked onchange="toggleAudioPref()">
                            <label class="form-check-label small fw-semibold" for="joinWithAudio">Ses Açık Katıl</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="joinWithVideo" checked onchange="toggleVideoPref()">
                            <label class="form-check-label small fw-semibold" for="joinWithVideo">Kamera Açık Katıl</label>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button onclick="joinRoom()" class="btn btn-primary fw-bold py-2">🚀 Toplantıya Katıl</button>
                        <button onclick="window.location.href='/dashboard'" class="btn btn-outline-secondary btn-sm">← Panele Dön</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', path='js/preview.js') }}"></script>
</body>
</html>
