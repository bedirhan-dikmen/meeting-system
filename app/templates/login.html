<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap - Kurumsal Toplantı Yönetim Sistemi</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent 40%),
                  radial-gradient(circle at bottom left, rgba(6, 182, 212, 0.15), transparent 40%),
                  var(--bg-primary);
    }
    .login-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(16px);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 60px; height: 60px; border-radius: var(--radius-md); background: linear-gradient(135deg, var(--accent-primary), var(--accent-cyan)); display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; color: #fff; margin-bottom: 1rem;">
        <i class="fas fa-video"></i>
      </div>
      <h2 style="font-size: 1.6rem; font-weight: 800;">Hoş Geldiniz</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.25rem;">Toplantı Portalına Giriş Yapın</p>
    </div>

    <!-- Tab Switcher (Form Data vs User Code) -->
    <div style="display: flex; background: var(--bg-primary); padding: 4px; border-radius: var(--radius-md); margin-bottom: 1.5rem;">
      <button id="tabEmail" type="button" class="btn btn-secondary" style="flex: 1; border: none; font-size: 0.85rem;" onclick="switchLoginTab('email')">E-Posta İle</button>
      <button id="tabCode" type="button" class="btn btn-secondary" style="flex: 1; border: none; font-size: 0.85rem; background: transparent;" onclick="switchLoginTab('code')">Personel Kodu İle</button>
    </div>

    <form id="formLogin">
      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label id="lblUsername">E-Posta Adresi</label>
        <input type="text" id="loginUsername" class="form-control" placeholder="ornek@sirket.com" required>
      </div>

      <div class="form-group" style="margin-bottom: 1.75rem;">
        <label>Şifre</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem;">
        <i class="fas fa-sign-in-alt"></i> Giriş Yap
      </button>
    </form>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="/static/js/auth.js"></script>
  <script src="/static/js/notifications.js"></script>
  <script>
    let loginMode = 'email';

    function switchLoginTab(mode) {
      loginMode = mode;
      const tabEmail = document.getElementById('tabEmail');
      const tabCode = document.getElementById('tabCode');
      const lbl = document.getElementById('lblUsername');
      const input = document.getElementById('loginUsername');

      if (mode === 'email') {
        tabEmail.style.background = 'var(--bg-secondary)';
        tabCode.style.background = 'transparent';
        lbl.textContent = 'E-Posta Adresi';
        input.placeholder = 'ornek@sirket.com';
      } else {
        tabCode.style.background = 'var(--bg-secondary)';
        tabEmail.style.background = 'transparent';
        lbl.textContent = 'Personel / User Kodu';
        input.placeholder = 'USR-1001';
      }
    }

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;

      try {
        let endpoint = '/api/v1/auth/login';
        let body = null;
        let headers = {};

        if (loginMode === 'email') {
          // OAuth2 Form Data format
          const formData = new URLSearchParams();
          formData.append('username', username);
          formData.append('password', password);
          body = formData;
          headers['Content-Type'] = 'application/x-www-form-urlencoded';
        } else {
          endpoint = '/api/v1/auth/login-external';
          body = JSON.stringify({ user_code: username, password: password });
          headers['Content-Type'] = 'application/json';
        }

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: headers,
          body: body
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.detail || "Giriş başarısız. Bilgilerinizi kontrol edin.");
        }

        const data = await response.json();
        
        // Fetch current user details if needed or store token
        Auth.saveAuth(data.access_token, data.user || { first_name: 'Kullanıcı', email: username });
        Notifications.show('Başarıyla giriş yapıldı. Yönlendiriliyorsunuz...', 'success', 'Giriş Başarılı');

        setTimeout(() => {
          window.location.href = '/';
        }, 1000);
      } catch (err) {
        console.error(err);
        Notifications.show(err.message, 'danger', 'Giriş Hatası');
      }
    });
  </script>
</body>
</html>
