<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yebsoft - Giriş</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/login.css') }}">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-card">
                <div class="login-logo">
                    <h2>💼 Yebsoft</h2>
                    <p>Kurumsal Toplantı Yönetimi</p>
                </div>
                
                <form id="loginForm" class="login-form" novalidate>
                    <div id="loginError" class="login-error"></div>
                    
                    <div class="form-group">
                        <label for="email">📧 E-posta</label>
                        <input type="email" 
                               id="email" 
                               class="form-control" 
                               placeholder="ornek@sirket.com" 
                               required 
                               autofocus>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">🔒 Şifre</label>
                        <input type="password" 
                               id="password" 
                               class="form-control" 
                               placeholder="••••••••" 
                               required>
                    </div>
                    
                    <button type="submit" id="loginBtn" class="login-btn">
                        <span id="loginBtnText">Giriş Yap</span>
                        <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                    </button>
                </form>
                
                <div class="login-footer">
                    <p>© 2026 Yebsoft. Tüm hakları saklıdır.</p>
                </div>
            </div>
        </div>
    </div>
    
    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', path='js/login.js') }}"></script>
</body>
</html>
