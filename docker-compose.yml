x-casaos:
  architectures:
    - amd64
    - arm64
  main: nginx
  author: Yebsoft
  category: Communication
  hostname: meeting-system
  icon: https://cdn-icons-png.flaticon.com/512/3820/3820168.png
  index: /
  port_map: "8090"
  title:
    en_us: Yebsoft Meeting System
    tr_tr: Yebsoft Toplantı Sistemi
  description:
    en_us: WebRTC Video Conference & Meeting Platform
    tr_tr: Yebsoft WebRTC Görüntülü Toplantı ve Konferans Platformu

services:
  db:
    image: postgres:16-alpine
    container_name: meeting_system_db
    restart: always
    ports:
      - "5443:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: meeting_system_api:latest
    container_name: meeting_system_api
    restart: always
    # V1 TESLİM FIX: Tüm değerler eskiden burada DÜZ METİN olarak sabit
    # kodluydu (sır/domain fark etmeksizin) — bu dosya git'e commitlendiğinden
    # her deploy eden kişi aynı sırları ve BU projeye özel domain'i miras
    # alıyordu, kendi ortamı için değiştirmek istediğinde de bu VERSİYON
    # KONTROLLÜ dosyayı elden geçirmek zorunda kalıyordu (→ gelecekteki
    # git pull'larla çakışma riski). Artık her şey .env'den okunuyor
    # (bkz. .env.example) — kendi ortamınız için sadece .env'i doldurun,
    # bu dosyaya hiç dokunmanız gerekmiyor.
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      # GÜVENLİK: Canlıya çıkmadan önce .env'de bu ikisini MUTLAKA değiştirin.
      - SEED_DEFAULT_PASSWORD=${SEED_DEFAULT_PASSWORD}
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - AVATAR_UPLOAD_DIR=app/static/avatars
      - DB_MAX_OVERFLOW=10
      - DB_POOL_RECYCLE=3600
      - DB_POOL_SIZE=20
      - DB_POOL_TIMEOUT=30
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./app:/workspace/app
      - ./avatars_data:/workspace/app/static/avatars
      - ./uploads_data:/workspace/uploads
    depends_on:
      db:
        condition: service_healthy

  coturn:
    image: coturn/coturn:latest
    container_name: meeting_system_coturn
    restart: always
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49152-49200:49152-49200/udp"
    # DİKKAT: --user buradaki kullanıcı adı/şifre, app/static/js/webrtc.js
    # içindeki getIceServers()'da HARD-CODE edilmiş TURN_USERNAME/TURN_CREDENTIAL
    # ile birebir aynı olmalı (istemci tarafı statik JS, .env'i okuyamaz).
    # Burayı değiştirirseniz webrtc.js'teki o iki satırı da güncelleyin.
    command: ["turnserver", "-n", "--log-file=stdout", "--lt-cred-mech", "--fingerprint", "--realm=${DOMAIN:-localhost}", "--user=${TURN_USERNAME}:${TURN_CREDENTIAL}"]

  nginx:
    image: nginx:alpine
    container_name: meeting_system_nginx
    restart: always
    ports:
      - "8090:80"
      - "443:443"
    entrypoint: [ "/bin/sh", "/etc/nginx/nginx-entrypoint.sh" ]
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx-entrypoint.sh:/etc/nginx/nginx-entrypoint.sh:ro
      - ./certbot_certs:/etc/letsencrypt
      - ./certbot_www:/var/www/certbot
    depends_on:
      - web
