version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: meeting_system_db
    restart: always
    environment:
      POSTGRES_USER: yebsoft_user
      POSTGRES_PASSWORD: YebsoftSecretPassword2026!
      POSTGRES_DB: meeting_system_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yebsoft_user -d meeting_system_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: meeting_system_api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/code  # Lokal kod degisikliklerinin Docker icinde anlik yansımasını saglar
    environment:
      - DATABASE_URL=postgresql://yebsoft_user:YebsoftSecretPassword2026!@db:5432/meeting_system_prod
      - SECRET_KEY=yebsoft_super_secure_crypto_secret_key_2026_jwt
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /code # Canli hot-reload aktif!

  livekit:
    image: livekit/livekit-server:v1.5
    container_name: yebsoft_livekit
    command: --config /etc/livekit.yaml
    restart: always
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50010:50000-50010/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml

volumes:
  postgres_data: